<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ripple</title>
  <style>
    :root { --sz: 422px; }
    @media (min-width: 1440px) { :root { --sz: 576px; } }
    @media (max-width: 480px)  { :root { --sz: 322px; } }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; font-family: system-ui, sans-serif; cursor: none;
    }
    #wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    canvas {
      width: var(--sz); height: var(--sz);
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); display: block;
    }
    #label {
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="500" height="500"></canvas>
    <span id="label">ripple — move + click</span>
  </div>
<script>
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const W = 500, H = 500;

  // ── Wave simulation ───────────────────────────────────────────────────────
  const GSIZE  = 30;
  const PAD    = 18;
  const cellW  = (W - PAD * 2) / (GSIZE - 1);
  const cellH  = (H - PAD * 2) / (GSIZE - 1);
  const C_WAVE = 24;    // grid units/s
  const DAMP   = 0.997; // gentle damping — waves persist and interfere more

  const u  = new Float32Array(GSIZE * GSIZE); // current
  const u1 = new Float32Array(GSIZE * GSIZE); // previous
  const nu = new Float32Array(GSIZE * GSIZE); // scratch

  function I(r, c) { return r * GSIZE + c; }

  // Grid dot rest positions (only computed once)
  const dots = [];
  for (let r = 0; r < GSIZE; r++)
    for (let c = 0; c < GSIZE; c++)
      dots.push({ x: PAD + c * cellW, y: PAD + r * cellH, gr: r, gc: c });

  let mx = -9999, my = -9999, isInside = false;
  let lastCursorCell = -1;
  const rings = [];

  // ── Audio ─────────────────────────────────────────────────────────────────
  let clickAudio = null;
  function initAudio() {
    if (clickAudio) return;
    clickAudio = new Audio('./sounds/selection.mp3');
    clickAudio.volume = 0.42;
  }
  function playClick() { initAudio(); clickAudio.currentTime = 0; clickAudio.play().catch(()=>{}); }

  // ── Events ────────────────────────────────────────────────────────────────
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mx = (e.clientX - r.left) * (W / r.width);
    my = (e.clientY - r.top)  * (H / r.height);
    isInside = true;
  });
  canvas.addEventListener('mouseleave', () => {
    isInside = false; mx = -9999; my = -9999; lastCursorCell = -1;
  });

  canvas.addEventListener('pointerdown', e => {
    const r  = canvas.getBoundingClientRect();
    const cx = (e.clientX - r.left) * (W / r.width);
    const cy = (e.clientY - r.top)  * (H / r.height);
    const nr = Math.max(1, Math.min(GSIZE-2, Math.round((cy - PAD) / cellH)));
    const nc = Math.max(1, Math.min(GSIZE-2, Math.round((cx - PAD) / cellW)));
    u[I(nr,   nc)]   += 5.5;
    u[I(nr-1, nc)]   += 2.8;
    u[I(nr+1, nc)]   += 2.8;
    u[I(nr,   nc-1)] += 2.8;
    u[I(nr,   nc+1)] += 2.8;
    rings.push({ x: cx, y: cy, r: 0, born: 0 });
    playClick();
  });

  // ── Update ────────────────────────────────────────────────────────────────
  let last = performance.now();

  function update(now) {
    const dt  = Math.min((now - last) / 1000, 0.05);
    last = now;
    const fac = (C_WAVE * dt) * (C_WAVE * dt);

    // 2D finite-difference wave equation
    for (let r = 1; r < GSIZE-1; r++) {
      for (let c = 1; c < GSIZE-1; c++) {
        const i   = I(r, c);
        const lap = u[I(r+1,c)] + u[I(r-1,c)] + u[I(r,c+1)] + u[I(r,c-1)] - 4*u[i];
        nu[i] = (2*u[i] - u1[i] + fac * lap) * DAMP;
      }
    }

    // Neumann (reflecting) boundaries — waves bounce off edges
    for (let k = 0; k < GSIZE; k++) {
      nu[I(0,k)]       = nu[I(1,k)];
      nu[I(GSIZE-1,k)] = nu[I(GSIZE-2,k)];
      nu[I(k,0)]       = nu[I(k,1)];
      nu[I(k,GSIZE-1)] = nu[I(k,GSIZE-2)];
    }

    // Cursor excites a wave each time it enters a new grid cell
    if (isInside) {
      const nr = Math.max(1, Math.min(GSIZE-2, Math.round((my - PAD) / cellH)));
      const nc = Math.max(1, Math.min(GSIZE-2, Math.round((mx - PAD) / cellW)));
      const ci = I(nr, nc);
      if (ci !== lastCursorCell) {
        nu[ci]          += 0.55;
        nu[I(nr-1, nc)] += 0.22;
        nu[I(nr+1, nc)] += 0.22;
        nu[I(nr, nc-1)] += 0.22;
        nu[I(nr, nc+1)] += 0.22;
        lastCursorCell = ci;
      }
    }

    // Ambient impulses — keeps the surface alive at rest
    if (Math.random() < 0.018) {
      const r = 1 + Math.floor(Math.random() * (GSIZE-2));
      const c = 1 + Math.floor(Math.random() * (GSIZE-2));
      const amp = 0.32 + Math.random() * 0.28;
      nu[I(r,c)]     += amp;
      nu[I(r-1,c)]   += amp * 0.5;
      nu[I(r+1,c)]   += amp * 0.5;
      nu[I(r,c-1)]   += amp * 0.5;
      nu[I(r,c+1)]   += amp * 0.5;
    }

    u1.set(u);
    u.set(nu);

    for (let i = rings.length - 1; i >= 0; i--) {
      rings[i].born += dt;
      rings[i].r    += 265 * dt;
      if (rings[i].r > W * 1.5) rings.splice(i, 1);
    }
  }

  // ── Draw ──────────────────────────────────────────────────────────────────
  const DOT_R    = 2.6;
  const DISP_SCL = 3.4; // pixels of XY displacement per unit wave gradient

  function draw() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.roundRect(0, 0, W, H, 10); ctx.fill();

    ctx.globalCompositeOperation = 'screen';

    // Click rings
    rings.forEach(rg => {
      const a = Math.max(0, 0.48 * (1 - rg.born * 1.4));
      ctx.beginPath();
      ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    });

    // Dots — displaced in XY by wave gradient so they physically ride the surface
    dots.forEach(d => {
      const val  = u[I(d.gr, d.gc)];
      const disp = Math.max(-1.2, Math.min(3.5, val));

      const brightness = Math.max(0.06, 0.20 + disp * 0.52);
      const radius     = Math.max(0.4,  DOT_R * (1 + disp * 0.30));

      // Wave gradient → positional displacement
      const r1 = d.gr > 0       ? d.gr - 1 : 0;
      const r2 = d.gr < GSIZE-1 ? d.gr + 1 : GSIZE-1;
      const c1 = d.gc > 0       ? d.gc - 1 : 0;
      const c2 = d.gc < GSIZE-1 ? d.gc + 1 : GSIZE-1;
      const gradR = u[I(r2, d.gc)] - u[I(r1, d.gc)];
      const gradC = u[I(d.gr, c2)] - u[I(d.gr, c1)];
      const px = d.x + gradC * DISP_SCL;
      const py = d.y + gradR * DISP_SCL;

      if (Math.abs(disp) > 0.15) {
        ctx.shadowBlur  = Math.abs(disp) * 10;
        ctx.shadowColor = `rgba(255,255,255,${Math.min(0.6, Math.abs(disp) * 0.38)})`;
      }

      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1, brightness).toFixed(3)})`;
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // Cursor dot
    if (isInside && mx > 0) {
      ctx.beginPath();
      ctx.arc(mx, my, 2.5, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.50)';
      ctx.fill();
    }
  }

  function loop(now) {
    update(now);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
