<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ripple</title>
  <style>
    :root { --sz: 422px; }
    @media (min-width: 1440px) { :root { --sz: 576px; } }
    @media (max-width: 480px)  { :root { --sz: 322px; } }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; font-family: system-ui, sans-serif; cursor: none;
    }
    #wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    canvas {
      width: var(--sz); height: var(--sz);
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); display: block;
    }
    #label {
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="500" height="500"></canvas>
    <span id="label">ripple — move + click</span>
  </div>
<script>
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const W = 500, H = 500;

  // ── Wave simulation ───────────────────────────────────────────────────────
  const GSIZE  = 26;
  const PAD    = 22;
  const cellW  = (W - PAD * 2) / (GSIZE - 1);
  const cellH  = (H - PAD * 2) / (GSIZE - 1);
  const C_WAVE = 28;    // grid units / s  (Courant safe: C*dt ≈ 0.47 < 0.707)
  const DAMP   = 0.994; // per-frame energy loss

  // Two-frame history for the finite-difference wave equation
  const u  = new Float32Array(GSIZE * GSIZE); // current
  const u1 = new Float32Array(GSIZE * GSIZE); // previous

  function I(r, c) { return r * GSIZE + c; }

  // Grid dot positions (fixed)
  const dots = [];
  for (let r = 0; r < GSIZE; r++)
    for (let c = 0; c < GSIZE; c++)
      dots.push({ x: PAD + c * cellW, y: PAD + r * cellH, gr: r, gc: c });

  let mx = -9999, my = -9999, isInside = false;
  let lastCursorCell = -1;
  const rings = [];

  // ── Audio ─────────────────────────────────────────────────────────────────
  let hoverAudio = null, clickAudio = null;
  function initAudio() {
    if (hoverAudio) return;
    hoverAudio = new Audio('./sounds/selection.mp3');
    hoverAudio.volume = 0.06;
    clickAudio = new Audio('./sounds/selection.mp3');
    clickAudio.volume = 0.42;
  }
  function playNote() { initAudio(); hoverAudio.currentTime = 0; hoverAudio.play().catch(()=>{}); }
  function playClick() { initAudio(); clickAudio.currentTime = 0; clickAudio.play().catch(()=>{}); }

  let lastTickDot = -1, lastTickMs = 0;
  function maybeNoteDot(di) {
    if (di === lastTickDot) return;
    const now = performance.now();
    if (now - lastTickMs < 240) return;
    lastTickDot = di; lastTickMs = now;
    playNote();
  }

  // ── Events ────────────────────────────────────────────────────────────────
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mx = (e.clientX - r.left) * (W / r.width);
    my = (e.clientY - r.top)  * (H / r.height);
    isInside = true;

    // Sound: nearest dot
    let nearestDi = -1, nearestDist = 9999;
    dots.forEach((d, i) => {
      const dist = Math.hypot(d.x - mx, d.y - my);
      if (dist < nearestDist) { nearestDist = dist; nearestDi = i; }
    });
    if (nearestDist < 22) maybeNoteDot(nearestDi);
  });
  canvas.addEventListener('mouseleave', () => {
    isInside = false; mx = -9999; my = -9999;
    lastTickDot = -1; lastCursorCell = -1;
  });

  canvas.addEventListener('pointerdown', e => {
    const r  = canvas.getBoundingClientRect();
    const cx = (e.clientX - r.left) * (W / r.width);
    const cy = (e.clientY - r.top)  * (H / r.height);
    // Impulse at nearest grid cell
    const nr = Math.max(1, Math.min(GSIZE-2, Math.round((cy - PAD) / cellH)));
    const nc = Math.max(1, Math.min(GSIZE-2, Math.round((cx - PAD) / cellW)));
    u[I(nr, nc)]     += 4.5;
    u[I(nr-1, nc)]   += 2.0;
    u[I(nr+1, nc)]   += 2.0;
    u[I(nr, nc-1)]   += 2.0;
    u[I(nr, nc+1)]   += 2.0;
    rings.push({ x: cx, y: cy, r: 0, born: 0 });
    playClick();
  });

  // ── Update ────────────────────────────────────────────────────────────────
  let last = performance.now();
  const nu = new Float32Array(GSIZE * GSIZE); // reuse buffer

  function update(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const fac = (C_WAVE * dt) * (C_WAVE * dt);

    // 2D finite-difference wave equation (interior)
    for (let r = 1; r < GSIZE-1; r++) {
      for (let c = 1; c < GSIZE-1; c++) {
        const i   = I(r, c);
        const lap = u[I(r+1,c)] + u[I(r-1,c)] + u[I(r,c+1)] + u[I(r,c-1)] - 4*u[i];
        nu[i] = (2*u[i] - u1[i] + fac * lap) * DAMP;
      }
    }

    // Neumann (reflecting) boundaries — waves bounce off edges
    for (let k = 0; k < GSIZE; k++) {
      nu[I(0,k)]        = nu[I(1,k)];
      nu[I(GSIZE-1,k)]  = nu[I(GSIZE-2,k)];
      nu[I(k,0)]        = nu[I(k,1)];
      nu[I(k,GSIZE-1)]  = nu[I(k,GSIZE-2)];
    }

    // Cursor excites a small wave when it enters a new cell
    if (isInside) {
      const nr = Math.max(1, Math.min(GSIZE-2, Math.round((my - PAD) / cellH)));
      const nc = Math.max(1, Math.min(GSIZE-2, Math.round((mx - PAD) / cellW)));
      const ci = I(nr, nc);
      if (ci !== lastCursorCell) {
        nu[ci]          += 0.45;
        nu[I(nr-1, nc)] += 0.18;
        nu[I(nr+1, nc)] += 0.18;
        nu[I(nr, nc-1)] += 0.18;
        nu[I(nr, nc+1)] += 0.18;
        lastCursorCell = ci;
      }
    }

    // Rare ambient impulse — keeps surface alive at rest
    if (Math.random() < 0.007) {
      const r = 1 + Math.floor(Math.random() * (GSIZE-2));
      const c = 1 + Math.floor(Math.random() * (GSIZE-2));
      nu[I(r,c)] += 0.4 + Math.random() * 0.35;
    }

    u1.set(u);
    u.set(nu);

    // Age rings
    for (let i = rings.length - 1; i >= 0; i--) {
      rings[i].born += dt;
      rings[i].r    += 265 * dt;
      if (rings[i].r > W * 1.5) rings.splice(i, 1);
    }
  }

  // ── Draw ──────────────────────────────────────────────────────────────────
  const DOT_R = 3.2;

  function draw() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.roundRect(0, 0, W, H, 10); ctx.fill();

    ctx.globalCompositeOperation = 'screen';

    // Click rings
    rings.forEach(rg => {
      const a = Math.max(0, 0.48 * (1 - rg.born * 1.4));
      ctx.beginPath();
      ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    });

    // Dots
    dots.forEach(d => {
      const val  = u[I(d.gr, d.gc)];
      const disp = Math.max(-1, Math.min(3, val));

      // Crest = bright + big, trough = dim + small
      const brightness = Math.max(0.05, 0.22 + disp * 0.55);
      const r = Math.max(0.3, DOT_R * (1 + disp * 0.38));

      if (Math.abs(disp) > 0.2) {
        ctx.shadowBlur  = Math.abs(disp) * 13;
        ctx.shadowColor = `rgba(255,255,255,${Math.min(0.7, Math.abs(disp) * 0.45)})`;
      }

      ctx.beginPath();
      ctx.arc(d.x, d.y, r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1, brightness).toFixed(3)})`;
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // Cursor dot
    if (isInside && mx > 0) {
      ctx.beginPath();
      ctx.arc(mx, my, 2.5, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.50)';
      ctx.fill();
    }
  }

  function loop(now) {
    update(now);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
