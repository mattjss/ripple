<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ripple</title>
  <style>
    :root { --sz: 422px; }
    @media (min-width: 1440px) { :root { --sz: 576px; } }
    @media (max-width: 480px)  { :root { --sz: 322px; } }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    canvas {
      width: var(--sz);
      height: var(--sz);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      cursor: crosshair;
      display: block;
    }

    #label {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="500" height="500"></canvas>
    <span id="label">ripple — move + click</span>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const W = 500, H = 500;

    const COLS = 20, ROWS = 20;
    const PAD  = 24;
    const cellW = (W - PAD * 2) / (COLS - 1);
    const cellH = (H - PAD * 2) / (ROWS - 1);

    const dots = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        dots.push({ x: PAD + c * cellW, y: PAD + r * cellH, scale: 1, vel: 0, base: 1 });
      }
    }

    const ripples = [];
    const rings   = []; // visual expanding rings on click
    let mx = -9999, my = -9999;
    let isInside = false;

    // ── Audio ─────────────────────────────────────────────────
    let hoverAudio = null, clickAudio = null;
    function initAudio() {
      if (hoverAudio) return;
      hoverAudio = new Audio('./sounds/selection.mp3');
      hoverAudio.volume = 0.06;
      clickAudio = new Audio('./sounds/selection.mp3');
      clickAudio.volume = 0.42;
    }
    function playNote() {
      initAudio();
      hoverAudio.currentTime = 0;
      hoverAudio.play().catch(() => {});
    }
    function playClick() {
      initAudio();
      clickAudio.currentTime = 0;
      clickAudio.play().catch(() => {});
    }

    let lastTickDot = -1, lastTickMs = 0;
    function maybeNoteDot(di) {
      if (di === lastTickDot) return;
      const now = performance.now();
      if (now - lastTickMs < 240) return;
      lastTickDot = di;
      lastTickMs = now;
      playNote();
    }

    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      mx = (e.clientX - r.left) * (W / r.width);
      my = (e.clientY - r.top)  * (H / r.height);
      isInside = true;
      let nearestDi = -1, nearestDist = 9999;
      dots.forEach((d, i) => {
        const dist = Math.hypot(d.x - mx, d.y - my);
        if (dist < nearestDist) { nearestDist = dist; nearestDi = i; }
      });
      if (nearestDist < 22) maybeNoteDot(nearestDi);
    });

    canvas.addEventListener('mouseleave', () => {
      isInside = false; mx = -9999; my = -9999; lastTickDot = -1;
    });

    canvas.addEventListener('pointerdown', e => {
      const r = canvas.getBoundingClientRect();
      const cx = (e.clientX - r.left) * (W / r.width);
      const cy = (e.clientY - r.top)  * (H / r.height);
      ripples.push({ cx, cy, t: 0 });
      rings.push({ cx, cy, r: 0, born: 0 });
      playClick();
    });

    const STIFFNESS  = 0.25;
    const DAMPING    = 0.65;
    const DOT_R      = 2.5;
    const HOVER_R    = 88;
    const RIPPLE_SPD = 140;
    const RIPPLE_DUR = 1.8;

    let last = performance.now();

    function update(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      const t = now / 1000;

      for (let i = ripples.length - 1; i >= 0; i--) {
        ripples[i].t += dt;
        if (ripples[i].t > RIPPLE_DUR) ripples.splice(i, 1);
      }
      for (let i = rings.length - 1; i >= 0; i--) {
        rings[i].born += dt;
        rings[i].r    += 280 * dt;
        if (rings[i].r > W * 1.5) rings.splice(i, 1);
      }

      dots.forEach(d => {
        const breathe = 0.014 * Math.sin(t * 1.6 + d.x * 0.013 + d.y * 0.011);
        let target = d.base + breathe;

        if (isInside) {
          const dist = Math.hypot(d.x - mx, d.y - my);
          if (dist < HOVER_R) target += (1 - dist / HOVER_R) * 2.8;
        }

        ripples.forEach(rip => {
          const dist     = Math.hypot(d.x - rip.cx, d.y - rip.cy);
          const waveFront = rip.t * RIPPLE_SPD;
          const waveDiff  = dist - waveFront;
          if (Math.abs(waveDiff) < 60) {
            target += Math.sin((1 - Math.abs(waveDiff) / 60) * Math.PI) * 2.2 * (1 - rip.t / RIPPLE_DUR);
          }
        });

        const spring = (target - d.scale) * STIFFNESS;
        d.vel = (d.vel + spring) * DAMPING;
        d.scale += d.vel;
      });
    }

    function draw() {
      // Black base in source-over, then screen for all dots
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.roundRect(0, 0, W, H, 10);
      ctx.fill();

      // Cursor heat aura
      if (isInside) {
        ctx.globalCompositeOperation = 'screen';
        const aura = ctx.createRadialGradient(mx, my, 0, mx, my, HOVER_R * 1.1);
        aura.addColorStop(0,   'rgba(255,140,40,0.14)');
        aura.addColorStop(0.5, 'rgba(255,80,20,0.05)');
        aura.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.beginPath();
        ctx.arc(mx, my, HOVER_R * 1.1, 0, Math.PI*2);
        ctx.fillStyle = aura;
        ctx.fill();
      }

      ctx.globalCompositeOperation = 'screen';

      // Click rings (warm)
      rings.forEach(rg => {
        const a = Math.max(0, 0.55 * (1 - rg.born * 1.4));
        ctx.beginPath();
        ctx.arc(rg.cx, rg.cy, rg.r, 0, Math.PI*2);
        ctx.strokeStyle = `hsla(35,100%,70%,${a.toFixed(3)})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

      // Dots
      dots.forEach(d => {
        const r    = Math.max(0.1, DOT_R * d.scale);
        const disp = Math.max(0, d.scale - 1);
        const t    = Math.min(disp / 1.8, 1);

        // Blackbody color: deep blue at rest → cyan → warm white when excited
        const hue = 215 - t * 182;  // 215 (blue) → 33 (orange)
        const sat = 65  + t * 35;   // 65% → 100%
        const lit = 26  + t * 60;   // 26% → 86%

        if (disp > 0.08) {
          ctx.shadowBlur  = disp * 16;
          ctx.shadowColor = `hsl(${hue.toFixed(0)},${sat.toFixed(0)}%,${lit.toFixed(0)}%)`;
        }

        ctx.beginPath();
        ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${hue.toFixed(0)},${sat.toFixed(0)}%,${lit.toFixed(0)}%)`;
        ctx.fill();
        ctx.shadowBlur = 0;
      });
    }

    function loop(now) {
      update(now);
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
