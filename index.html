<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ripple</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    canvas {
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      cursor: crosshair;
      display: block;
    }

    #label {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="500" height="500"></canvas>
    <span id="label">ripple — move + click</span>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const W = 500, H = 500;

    const COLS = 20, ROWS = 20;
    const PAD  = 24;
    const cellW = (W - PAD * 2) / (COLS - 1);
    const cellH = (H - PAD * 2) / (ROWS - 1);

    const dots = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        dots.push({ x: PAD + c * cellW, y: PAD + r * cellH, scale: 1, vel: 0, base: 1 });
      }
    }

    const ripples = [];
    let mx = -9999, my = -9999;
    let isInside = false;

    // ── Audio ─────────────────────────────────────────────────
    let AC;
    function ac() {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      return AC;
    }

    const NOTES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
    let noteIdx = 0;
    let lastNoteTime = 0;

    function playNote(freq, vol = 0.08, dur = 0.18) {
      try {
        const a = ac();
        const t = a.currentTime;
        if (t - lastNoteTime < 0.06) return;
        lastNoteTime = t;
        const o = a.createOscillator(), g = a.createGain();
        o.connect(g); g.connect(a.destination);
        o.type = 'sine';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.start(t); o.stop(t + dur + 0.01);
      } catch (_) {}
    }

    function playClick() {
      try {
        const a = ac();
        const t = a.currentTime;
        [261.63, 392.00, 523.25].forEach((f, i) => {
          const o = a.createOscillator(), g = a.createGain();
          o.connect(g); g.connect(a.destination);
          o.type = 'sine';
          o.frequency.value = f;
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.12 - i * 0.03, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
          o.start(t); o.stop(t + 0.56);
        });
        const buf = a.createBuffer(1, a.sampleRate * 0.08, a.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        const src = a.createBufferSource();
        src.buffer = buf;
        const g2 = a.createGain(); g2.gain.value = 0.06;
        src.connect(g2); g2.connect(a.destination);
        src.start(t);
      } catch (_) {}
    }

    let lastTickDot = -1;
    function maybeNoteDot(di) {
      if (di === lastTickDot) return;
      lastTickDot = di;
      playNote(NOTES[noteIdx++ % NOTES.length], 0.055, 0.14);
    }

    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      mx = (e.clientX - r.left) * (W / r.width);
      my = (e.clientY - r.top)  * (H / r.height);
      isInside = true;
      let nearestDi = -1, nearestDist = 9999;
      dots.forEach((d, i) => {
        const dist = Math.hypot(d.x - mx, d.y - my);
        if (dist < nearestDist) { nearestDist = dist; nearestDi = i; }
      });
      if (nearestDist < 22) maybeNoteDot(nearestDi);
    });

    canvas.addEventListener('mouseleave', () => {
      isInside = false; mx = -9999; my = -9999; lastTickDot = -1;
    });

    canvas.addEventListener('pointerdown', e => {
      const r = canvas.getBoundingClientRect();
      ripples.push({
        cx: (e.clientX - r.left) * (W / r.width),
        cy: (e.clientY - r.top)  * (H / r.height),
        t: 0
      });
      playClick();
    });

    const STIFFNESS  = 0.25;
    const DAMPING    = 0.65;
    const DOT_R      = 2.5;
    const HOVER_R    = 80;
    const RIPPLE_SPD = 140;
    const RIPPLE_DUR = 1.8;

    let last = performance.now();

    function update(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      for (let i = ripples.length - 1; i >= 0; i--) {
        ripples[i].t += dt;
        if (ripples[i].t > RIPPLE_DUR) ripples.splice(i, 1);
      }
      dots.forEach(d => {
        let target = d.base;
        if (isInside) {
          const dist = Math.hypot(d.x - mx, d.y - my);
          if (dist < HOVER_R) target += (1 - dist / HOVER_R) * 1.6;
        }
        ripples.forEach(rip => {
          const dist = Math.hypot(d.x - rip.cx, d.y - rip.cy);
          const waveFront = rip.t * RIPPLE_SPD;
          const waveDiff  = dist - waveFront;
          if (Math.abs(waveDiff) < 60) {
            target += Math.sin((1 - Math.abs(waveDiff) / 60) * Math.PI) * 1.8 * (1 - rip.t / RIPPLE_DUR);
          }
        });
        const spring = (target - d.scale) * STIFFNESS;
        d.vel = (d.vel + spring) * DAMPING;
        d.scale += d.vel;
      });
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#0f0f0f';
      ctx.beginPath();
      ctx.roundRect(0, 0, W, H, 10);
      ctx.fill();
      dots.forEach(d => {
        const r = Math.max(0.1, DOT_R * d.scale);
        ctx.beginPath();
        ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${Math.min(1, 0.35 + (d.scale - 1) * 0.65)})`;
        ctx.fill();
      });
    }

    function loop(now) {
      update(now);
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
