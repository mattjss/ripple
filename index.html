<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>attract</title>
  <style>
    :root { --sz: 422px; }
    @media (min-width: 1440px) { :root { --sz: 576px; } }
    @media (max-width: 480px)  { :root { --sz: 322px; } }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; font-family: system-ui, sans-serif; cursor: none;
    }
    #wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    canvas {
      width: var(--sz); height: var(--sz);
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); display: block;
    }
    #label {
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="500" height="500"></canvas>
    <span id="label">attract — move + click</span>
  </div>
<script>
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const W = 500, H = 500;

  // ── Nodes ─────────────────────────────────────────────────────────────────
  const N_NODES    = 160;
  const CONNECT_D  = 82;   // draw line when closer than this (px)
  const ATTRACT_R  = 148;  // cursor pull radius
  const ATTRACT_A  = 230;  // pull acceleration at edge of radius (px/s²)
  const DRAG       = 2.6;  // velocity decay per second
  const BORDER_PAD = 32;   // px from edge where soft wall begins
  const BORDER_A   = 190;  // border repulsion acceleration
  const BURST_R    = 185;  // click burst radius
  const BURST_A    = 460;  // click burst acceleration

  const nodes = Array.from({ length: N_NODES }, () => ({
    x:  BORDER_PAD + Math.random() * (W - BORDER_PAD * 2),
    y:  BORDER_PAD + Math.random() * (H - BORDER_PAD * 2),
    vx: (Math.random() - 0.5) * 18,
    vy: (Math.random() - 0.5) * 18,
  }));

  let mx = -9999, my = -9999, isInside = false;
  const bursts = [];

  // ── Audio ─────────────────────────────────────────────────────────────────
  let clickAudio = null;
  function initAudio() {
    if (clickAudio) return;
    clickAudio = new Audio('./sounds/selection.mp3');
    clickAudio.volume = 0.42;
  }
  function playClick() { initAudio(); clickAudio.currentTime = 0; clickAudio.play().catch(()=>{}); }

  // ── Events ────────────────────────────────────────────────────────────────
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mx = (e.clientX - r.left) * (W / r.width);
    my = (e.clientY - r.top)  * (H / r.height);
    isInside = true;
  });
  canvas.addEventListener('mouseleave', () => { isInside = false; mx = -9999; my = -9999; });

  canvas.addEventListener('pointerdown', e => {
    const r  = canvas.getBoundingClientRect();
    const bx = (e.clientX - r.left) * (W / r.width);
    const by = (e.clientY - r.top)  * (H / r.height);
    nodes.forEach(n => {
      const dx = n.x - bx, dy = n.y - by;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < BURST_R && dist > 1) {
        const f = BURST_A * (1 - dist / BURST_R) / dist;
        n.vx += dx * f * 0.016; // scaled to 1 frame
        n.vy += dy * f * 0.016;
      }
    });
    bursts.push({ x: bx, y: by, r: 0, born: 0 });
    playClick();
  });

  // ── Update ────────────────────────────────────────────────────────────────
  let last = performance.now();

  function update(now) {
    const dt    = Math.min((now - last) / 1000, 0.05);
    last = now;
    const decay = Math.exp(-DRAG * dt);

    for (const n of nodes) {
      let ax = 0, ay = 0;

      // Cursor attraction
      if (isInside) {
        const dx = mx - n.x, dy = my - n.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < ATTRACT_R && dist > 2) {
          const f = ATTRACT_A * (1 - dist / ATTRACT_R) / dist;
          ax += dx * f;
          ay += dy * f;
        }
      }

      // Soft border walls
      if (n.x < BORDER_PAD)      ax += BORDER_A * (1 - n.x / BORDER_PAD);
      if (n.x > W - BORDER_PAD)  ax -= BORDER_A * (1 - (W - n.x) / BORDER_PAD);
      if (n.y < BORDER_PAD)      ay += BORDER_A * (1 - n.y / BORDER_PAD);
      if (n.y > H - BORDER_PAD)  ay -= BORDER_A * (1 - (H - n.y) / BORDER_PAD);

      n.vx = (n.vx + ax * dt) * decay;
      n.vy = (n.vy + ay * dt) * decay;
      n.x  = Math.max(2, Math.min(W - 2, n.x + n.vx * dt));
      n.y  = Math.max(2, Math.min(H - 2, n.y + n.vy * dt));
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      bursts[i].born += dt;
      bursts[i].r    += 265 * dt;
      if (bursts[i].r > W * 1.5) bursts.splice(i, 1);
    }
  }

  // ── Draw ──────────────────────────────────────────────────────────────────
  function draw() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.roundRect(0, 0, W, H, 10); ctx.fill();

    ctx.globalCompositeOperation = 'screen';

    // Burst rings
    bursts.forEach(b => {
      const a = Math.max(0, 0.46 * (1 - b.born * 1.45));
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.lineWidth = 1.3;
      ctx.stroke();
    });

    // Connections
    ctx.lineCap = 'round';
    const CD2 = CONNECT_D * CONNECT_D;
    for (let i = 0; i < N_NODES; i++) {
      for (let j = i + 1; j < N_NODES; j++) {
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const d2 = dx * dx + dy * dy;
        if (d2 >= CD2) continue;
        const t = 1 - Math.sqrt(d2) / CONNECT_D;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.strokeStyle = `rgba(255,255,255,${(t * t * 0.38).toFixed(3)})`;
        ctx.lineWidth   = t * 1.1;
        ctx.stroke();
      }
    }

    // Nodes
    for (const n of nodes) {
      let pull = 0;
      if (isInside) {
        const d = Math.hypot(n.x - mx, n.y - my);
        if (d < ATTRACT_R) pull = 1 - d / ATTRACT_R;
      }

      const radius = 1.8 + pull * 1.4;
      const alpha  = 0.24 + pull * 0.55;

      if (pull > 0.2) {
        ctx.shadowBlur  = pull * 14;
        ctx.shadowColor = `rgba(255,255,255,${(pull * 0.5).toFixed(3)})`;
      }

      ctx.beginPath();
      ctx.arc(n.x, n.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1, alpha).toFixed(3)})`;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Cursor
    if (isInside && mx > 0) {
      ctx.beginPath();
      ctx.arc(mx, my, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.50)';
      ctx.fill();
    }
  }

  function loop(now) {
    update(now);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
